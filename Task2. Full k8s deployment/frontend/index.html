<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📚 BookBarn</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .book { margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>Welcome to <em>BookBarn</em>!</h1>
  <p>Below is a live list from the Catalog API:</p>
  <div id="books"></div>

  <script>
    fetch("/api/demo")
      .then(r => r.json())
      .then(data => {
        if (data.sample_books) {
          data.sample_books.forEach(b => {
            const div = document.createElement("div");
            div.className = "book";
            div.textContent = `• ${b.title} (${b.year})`;
            document.getElementById("books").appendChild(div);
          });
        } else {
          document.getElementById("books").textContent =
            "⚠️ Could not reach catalog-api";
        }
      });
  </script>
</body>
</html>
